name: Hello Node App

on:
  push:
    
jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Use Node.js 14.x
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Install dependencies
      run: npm install

    - name: Run test suite
      run: npm test
